<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="XOX — a polished Tic Tac Toe game against Rocky.">
<meta name="color-scheme" content="dark">
<title>XOX — Tic Tac Toe vs Rocky</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--surface:#10141a;--surface2:#151a21;--stroke:#ffffff12;--stroke-strong:#ffffff20;--text:#f5f7fb;--muted:#8e98a8;--blue:#79aefc;--blue-soft:#79aefc18;--x:#ff7187;--o:#70b1ff;--win:#6ee7b7;--gold:#f2c66d;--radius-xl:30px;--radius-lg:22px;--radius-md:16px}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100svh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(700px 420px at 50% -10%,#26344a 0%,#151b25 40%,var(--bg) 76%);display:grid;place-items:center;overflow-x:hidden}button{font:inherit;color:inherit}
.app{width:min(100%,900px);padding:clamp(20px,4vw,38px);border:1px solid var(--stroke);border-radius:var(--radius-xl);background:#0d1117ee;box-shadow:0 28px 80px #000a,inset 0 1px #fff1;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-size:.74rem;font-weight:850;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.brand-mark{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 20px #79aefc88;animation:dot-breathe 2.4s ease-in-out infinite}.eyebrow{font-size:.7rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#6f7988}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;margin-bottom:28px}.hero h1{margin:0;font-size:clamp(2.7rem,8vw,4.8rem);line-height:.9;letter-spacing:-.075em}.hero h1 span{color:var(--blue)}.subtitle{margin:12px 0 0;color:var(--muted);font-size:.95rem}.live-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--stroke);border-radius:999px;background:#ffffff08;color:#b7c0ce;font-size:.72rem;font-weight:800;white-space:nowrap}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 12px #6ee7b788;animation:dot-pulse 1.8s ease-in-out infinite}
.arena{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}.opponent{position:sticky;top:16px;padding:18px;border:1px solid var(--stroke);border-radius:var(--radius-lg);background:linear-gradient(145deg,#151a22dd,#0e1218dd);text-align:center}.robot-face{width:112px;aspect-ratio:1;margin:0 auto 14px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,#232d3b,#11161e);border:1px solid var(--stroke-strong);box-shadow:inset 0 1px #fff1,0 18px 38px #0008;font-size:3.4rem;transition:transform .22s,box-shadow .22s}.opponent.thinking .robot-face{animation:pulse .7s ease-in-out infinite alternate}.opponent-name{font-weight:850;font-size:1rem}.opponent-role{margin-top:4px;color:var(--muted);font-size:.72rem}.robot-status{display:flex;justify-content:center;margin-top:13px;padding:8px 10px;border-radius:12px;background:var(--blue-soft);border:1px solid #79aefc2e;color:#b9d6ff;font-size:.7rem;font-weight:800}.opponent.thinking .robot-status{animation:status-pulse 1.1s ease-in-out infinite;color:#d1e4ff}
.game{min-width:0}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:11px 14px 11px 17px;margin-bottom:12px;border:1px solid var(--stroke);border-radius:var(--radius-md);background:var(--surface);font-size:.82rem;font-weight:800}.status-copy{display:flex;align-items:center;gap:9px}.turn-dot{width:8px;height:8px;border-radius:50%;background:var(--x);box-shadow:0 0 12px #ff718766;flex:none;animation:turn-pulse 1.45s ease-in-out infinite}.status[data-state="thinking"] .turn-dot{background:var(--o);box-shadow:0 0 14px #70b1ffbb;animation:dot-pulse .8s ease-in-out infinite}.status[data-state="finished"] .turn-dot{background:var(--win);box-shadow:0 0 14px #6ee7b7bb;animation:dot-breathe 1.8s ease-in-out infinite}.status-hint{color:var(--muted);font-size:.68rem;font-weight:650}
.board-wrap{padding:8px;border:1px solid var(--stroke);border-radius:26px;background:#090c11;box-shadow:inset 0 0 35px #000b}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{appearance:none;aspect-ratio:1;border:1px solid #ffffff0d;border-radius:18px;background:linear-gradient(145deg,#1a2029,#11161d);cursor:pointer;display:grid;place-items:center;font-size:clamp(2.7rem,10vw,4.6rem);font-weight:900;transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease}.cell:hover:not(:disabled),.cell:focus-visible:not(:disabled){transform:translateY(-2px);background:#202832;border-color:#ffffff28;outline:none;box-shadow:0 10px 24px #0006}.cell:active:not(:disabled){transform:scale(.96)}.cell:disabled{cursor:default}.cell.x{color:var(--x);text-shadow:0 0 28px #ff718744;animation:mark-in .28s cubic-bezier(.2,.9,.25,1.35)}.cell.o{color:var(--o);text-shadow:0 0 28px #70b1ff44;animation:mark-in .28s cubic-bezier(.2,.9,.25,1.35)}.cell.win{color:var(--win)!important;border-color:#6ee7b799;background:#6ee7b715;box-shadow:0 0 28px #6ee7b722;animation:win .7s ease-in-out infinite alternate}
.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.score{padding:11px 12px;border:1px solid var(--stroke);border-radius:15px;background:var(--surface);text-align:center}.score small{display:block;color:var(--muted);font-size:.67em;font-weight:750;text-transform:uppercase;letter-spacing:.07em}.score strong{display:block;margin-top:3px;font-size:1.35rem}.score.x strong{color:var(--x)}.score.o strong{color:var(--o)}.score.draw strong{color:var(--gold)}
.actions{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-top:12px}.actions button{min-height:48px;padding:11px 14px;border:1px solid var(--stroke-strong);border-radius:15px;background:var(--surface2);font-weight:850;cursor:pointer;transition:transform .14s,background .14s,border-color .14s}.actions .primary{background:#f0f5ff;color:#0a1018;border-color:transparent}.actions button:hover,.actions button:focus-visible{transform:translateY(-1px);border-color:#ffffff30;outline:none}.actions button:active{transform:scale(.98)}.hint{text-align:center;margin:12px 0 0;color:#697383;font-size:.68rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes mark-in{0%{opacity:0;transform:scale(.35) rotate(-8deg)}70%{opacity:1;transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0)}}@keyframes dot-breathe{0%,100%{opacity:.62;transform:scale(.88)}50%{opacity:1;transform:scale(1.18)}}@keyframes dot-pulse{0%,100%{opacity:.58;transform:scale(.78);box-shadow:0 0 8px currentColor}50%{opacity:1;transform:scale(1.28);box-shadow:0 0 18px currentColor}}@keyframes turn-pulse{0%,100%{transform:scale(.82);opacity:.65}50%{transform:scale(1.18);opacity:1}}@keyframes status-pulse{50%{border-color:#79aefc70;box-shadow:0 0 18px #79aefc20}}@keyframes win{to{transform:scale(1.035)}}@keyframes pulse{to{transform:translateY(-3px) scale(1.025);box-shadow:inset 0 1px #fff1,0 22px 45px #0009,0 0 28px #79aefc22}}@media(max-width:700px){body{place-items:start;padding:10px}.app{margin-top:8px;border-radius:26px}.topbar{margin-bottom:24px}.hero{grid-template-columns:1fr;gap:14px;margin-bottom:22px}.live-chip{justify-self:start}.arena{grid-template-columns:1fr;gap:14px}.opponent{position:static;display:grid;grid-template-columns:auto 1fr;grid-template-areas:'face name' 'face role' 'face status';column-gap:13px;align-items:center;text-align:left;padding:12px 14px}.robot-face{grid-area:face;width:64px;margin:0;border-radius:20px;font-size:2.1rem}.opponent-name{grid-area:name}.opponent-role{grid-area:role}.robot-status{grid-area:status;justify-content:flex-start;margin-top:5px;padding:5px 8px;width:max-content}.status{min-height:52px}.status-hint{display:none}.board-wrap{padding:7px;border-radius:22px}.cell{border-radius:15px}.actions button{min-height:46px}}@media(max-width:380px){.app{padding:15px}.hero h1{font-size:2.7rem}.score{padding:9px 5px}.actions{grid-template-columns:1fr}.hint{font-size:.64rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span>XOX Arena</div><div class="eyebrow">Classic · 3 × 3</div></header><section class="hero"><div><h1><span>X</span>OX</h1><p class="subtitle">A focused Tic Tac Toe duel against Rocky.</p></div><div class="live-chip"><span class="live-dot" aria-hidden="true"></span>Game ready</div></section><section class="arena" aria-label="XOX game"><aside class="opponent" id="robot" aria-label="Rocky robot opponent"><div class="robot-face" aria-hidden="true">🤖</div><div class="opponent-name">Rocky</div><div class="opponent-role">Your AI opponent · O</div><div class="robot-status" id="robotStatus">Ready to play</div></aside><div class="game"><div class="status" id="status" aria-live="polite" aria-atomic="true"><div class="status-copy"><span class="turn-dot" aria-hidden="true"></span><span id="statusText">Your turn · Place an X</span></div><span class="status-hint">You are X</span></div><div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div></div><div class="scorebar" aria-label="Scoreboard"><div class="score x"><small>You</small><strong id="playerScore">0</strong></div><div class="score draw"><small>Draws</small><strong id="drawScore">0</strong></div><div class="score o"><small>Rocky</small><strong id="robotScore">0</strong></div></div><div class="actions"><button class="primary" id="restart" type="button">Restart round</button><button id="newGame" type="button">Reset score</button></div><p class="hint">Tap an empty square · Arrow keys move · Enter or Space selects</p></div></section></main>
<script>
(()=>{'use strict';const boardEl=document.querySelector('#board'),statusBox=document.querySelector('#status'),statusEl=document.querySelector('#statusText'),robotStatus=document.querySelector('#robotStatus'),robotEl=document.querySelector('#robot'),playerScore=document.querySelector('#playerScore'),robotScore=document.querySelector('#robotScore'),drawScore=document.querySelector('#drawScore');const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),turn='X',active=true,thinking=false,timer=null,round=0,winning=[];let scores=loadScores();const cells=[];for(let i=0;i<9;i++){const cell=document.createElement('button');cell.className='cell';cell.type='button';cell.dataset.index=i;cell.setAttribute('role','gridcell');cell.addEventListener('click',()=>playerMove(i));cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();playerMove(i);return}if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();cells[(i+(e.key==='ArrowRight'?1:3))%9].focus()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();cells[(i-(e.key==='ArrowLeft'?1:3)+9)%9].focus()}});boardEl.appendChild(cell);cells.push(cell)}function loadScores(){try{const s=JSON.parse(localStorage.getItem('xox-score-v2'));return s&&Number.isFinite(s.x)&&Number.isFinite(s.o)&&Number.isFinite(s.d)?s:{x:0,o:0,d:0}}catch{return{x:0,o:0,d:0}}}function saveScores(){try{localStorage.setItem('xox-score-v2',JSON.stringify(scores))}catch{}}function setStatus(text,robot){statusEl.textContent=text;robotStatus.textContent=robot;statusBox.dataset.state=text.includes('thinking')?'thinking':text.includes('win')||text.includes('Draw')?'finished':'ready'}function result(b){for(const combo of wins){const[a,c,d]=combo;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return combo}return null}function render(){cells.forEach((cell,i)=>{const value=board[i];cell.textContent=value;cell.className='cell'+(value?' '+value.toLowerCase():'')+(winning.includes(i)?' win':'');cell.disabled=Boolean(value)||!active||thinking;cell.setAttribute('aria-label',`Cell ${i+1}: ${value||'empty'}`);cell.setAttribute('aria-selected',winning.includes(i)?'true':'false')});playerScore.textContent=scores.x;robotScore.textContent=scores.o;drawScore.textContent=scores.d;robotEl.classList.toggle('thinking',thinking)}function finish(combo){active=false;thinking=false;clearTimeout(timer);timer=null;winning=combo||[];if(combo){const winner=board[combo[0]];if(winner==='X'){scores.x++;setStatus('You win!','Rocky has been defeated this round')}else{scores.o++;setStatus('Rocky wins!','Rocky takes the round')}}else{scores.d++;setStatus('Draw game','Perfectly matched')}saveScores();render()}function move(index,player){if(index<0||index>8||board[index]||!active)return false;board[index]=player;const combo=result(board);if(combo){finish(combo);return true}if(!board.includes('')){finish(null);return true}turn=player==='X'?'O':'X';render();if(turn==='O')setStatus('Rocky is thinking…','Calculating the best move');return true}function playerMove(index){if(!active||thinking||turn!=='X'||board[index])return;if(!move(index,'X')||!active)return;thinking=true;const currentRound=round;render();timer=setTimeout(()=>{timer=null;if(!active||currentRound!==round)return;thinking=false;move(bestMove(),'O')},360)}function bestMove(){let best=-Infinity,choice=-1;const preferred=[4,0,2,6,8,1,3,5,7];for(const i of preferred){if(board[i])continue;board[i]='O';const score=minimax(board,false,0);board[i]='';if(score>best){best=score;choice=i}}return choice}function minimax(b,maximizing,depth){const combo=result(b);if(combo)return b[combo[0]]==='O'?100-depth:depth-100;if(!b.includes(''))return 0;if(maximizing){let best=-Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';best=Math.max(best,minimax(b,false,depth+1));b[i]=''}return best}let best=Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='X';best=Math.min(best,minimax(b,true,depth+1));b[i]=''}return best}function restart(){clearTimeout(timer);timer=null;round++;board=Array(9).fill('');turn='X';active=true;thinking=false;winning=[];setStatus('Your turn · Place an X','Ready to play');render();requestAnimationFrame(()=>cells[4].focus())}function newGame(){scores={x:0,o:0,d:0};saveScores();restart()}document.querySelector('#restart').addEventListener('click',restart);document.querySelector('#newGame').addEventListener('click',newGame);setStatus('Your turn · Place an X','Ready to play');render()})();
</script>
</body>
</html>
