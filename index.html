<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="description" content="Tic Tac Toe vs an intelligent robot.">
<title>XOX — Tic Tac Toe vs Robot</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151c;--panel2:#171c25;--line:#293241;--text:#f5f7fb;--muted:#929bab;--x:#ff6478;--o:#62a9ff;--win:#62e6a8;--shadow:0 24px 70px #0008}
*{box-sizing:border-box;margin:0}body{min-height:100svh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#25334e 0,#101620 38%,var(--bg) 72%);color:var(--text);display:grid;place-items:center;padding:18px;overflow-x:hidden}
button{font:inherit;color:inherit}.app{width:min(100%,760px);background:#0e1219eF;border:1px solid #ffffff12;border-radius:30px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow);backdrop-filter:blur(22px)}
header{text-align:center;margin-bottom:25px}h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.055em;line-height:1.05}h1 span{color:var(--o)}.subtitle{color:var(--muted);margin-top:9px;font-size:.98rem}
.arena{display:grid;grid-template-columns:190px 1fr;gap:30px;align-items:start}.robot{text-align:center}.robot-face{width:140px;aspect-ratio:1;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#202a39,#10151d);border:1px solid #ffffff18;box-shadow:inset 0 1px #ffffff12,0 15px 35px #0007;font-size:4.1rem}.robot-name{font-weight:700}.robot-status{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:999px;background:#62a9ff14;border:1px solid #62a9ff45;color:#a9ccff;font-size:.78rem}
.game{display:flex;flex-direction:column;align-items:center}.status{width:100%;text-align:center;min-height:46px;display:grid;place-items:center;padding:10px 14px;border-radius:15px;background:var(--panel);border:1px solid var(--line);font-weight:650;margin-bottom:14px}.board{width:min(100%,390px);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:9px;background:#090c11;border:1px solid #ffffff0c;border-radius:22px;box-shadow:inset 0 0 30px #0008}.cell{aspect-ratio:1;border:1px solid #ffffff0d;border-radius:16px;background:linear-gradient(145deg,#1a202a,#121720);font-size:clamp(2.8rem,11vw,4.4rem);font-weight:800;cursor:pointer;transition:transform .16s,background .16s,border-color .16s;display:grid;place-items:center}.cell:hover:not(:disabled){transform:translateY(-2px);background:#202835;border-color:#ffffff20}.cell:active:not(:disabled){transform:scale(.96)}.cell:disabled{cursor:default}.cell.x{color:var(--x);text-shadow:0 0 25px #ff647844}.cell.o{color:var(--o);text-shadow:0 0 25px #62a9ff44}.cell.win{color:var(--win)!important;border-color:#62e6a877;background:#62e6a814;animation:win 900ms ease-in-out infinite alternate}
@keyframes win{to{transform:scale(1.035);box-shadow:0 0 28px #62e6a822}}.scores{width:min(100%,390px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.score{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.score small{color:var(--muted);font-size:.72rem}.score strong{display:block;font-size:1.35rem;margin-top:2px}.score.x strong{color:var(--x)}.score.o strong{color:var(--o)}.score.draw strong{color:#f5bd58}
.controls{display:flex;gap:9px;width:min(100%,390px);margin-top:14px}.controls button{flex:1;border:1px solid var(--line);background:#191f29;border-radius:14px;padding:12px 14px;font-weight:700;cursor:pointer;transition:.16s}.controls button:first-child{background:#eaf2ff;color:#0b111a;border-color:transparent}.controls button:hover{transform:translateY(-1px)}.controls button:active{transform:scale(.98)}
@media(max-width:650px){body{padding:10px;align-items:start}.app{margin-top:10px;border-radius:24px}.arena{grid-template-columns:1fr;gap:18px}.robot-face{width:88px;font-size:2.6rem;margin-bottom:8px}.robot-status{margin-top:5px}.robot-name{font-size:.9rem}.game{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><h1><span>X</span>OX</h1><p class="subtitle">Tic Tac Toe · You vs Robot</p></header>
<section class="arena">
<aside class="robot" aria-label="Robot opponent"><div class="robot-face" aria-hidden="true">🤖</div><div class="robot-name">Rocky</div><div class="robot-status" id="robotStatus">Ready to play</div></aside>
<div class="game">
<div class="status" id="status" aria-live="polite">Your turn · Place an X</div>
<div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div>
<div class="scores" aria-label="Score"><div class="score x"><small>You</small><strong id="playerScore">0</strong></div><div class="score draw"><small>Draws</small><strong id="drawScore">0</strong></div><div class="score o"><small>Robot</small><strong id="robotScore">0</strong></div></div>
<div class="controls"><button id="restart" type="button">Restart round</button><button id="newGame" type="button">Reset score</button></div>
</div></section>
</main>
<script>
(() => {
 const boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),robotEl=document.querySelector('#robotStatus');
 const scoresEl={x:document.querySelector('#playerScore'),o:document.querySelector('#robotScore'),d:document.querySelector('#drawScore')};
 const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 let board=Array(9).fill(''),turn='X',active=true,thinking=false,scores={x:0,o:0,d:0},timer=null;
 const cells=[];
 for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.type='button';b.dataset.index=i;b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Cell ${i+1}, empty`);b.addEventListener('click',()=>playerMove(i));boardEl.appendChild(b);cells.push(b)}
 function setStatus(s,r){statusEl.textContent=s;robotEl.textContent=r}
 function result(b){for(const w of wins){const[a,c,d]=w;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return w}return null}
 function render(){cells.forEach((c,i)=>{c.textContent=board[i];c.className='cell'+(board[i]?` ${board[i].toLowerCase()}`:'');c.disabled=Boolean(board[i])||!active||thinking;c.setAttribute('aria-label',`Cell ${i+1}, ${board[i]||'empty'}`)});scoresEl.x.textContent=scores.x;scoresEl.o.textContent=scores.o;scoresEl.d.textContent=scores.d}
 function finish(combo){active=false;thinking=false;clearTimeout(timer);if(combo){combo.forEach(i=>cells[i].classList.add('win'));const winner=board[combo[0]];if(winner==='X'){scores.x++;setStatus('You win! 🎉','Defeated this round')}else{scores.o++;setStatus('Robot wins!','Rocky takes the round')}}else{scores.d++;setStatus('Draw game','Even match')}render()}
 function move(i,p){if(board[i]||!active)return false;board[i]=p;const combo=result(board);if(combo)finish(combo);else if(!board.includes(''))finish(null);else{turn=p==='X'?'O':'X';render();if(turn==='O')setStatus('Robot is thinking…','Calculating move')}return true}
 function playerMove(i){if(!active||thinking||turn!=='X'||board[i])return;move(i,'X');if(active){thinking=true;render();timer=setTimeout(()=>{thinking=false;const i=bestMove();move(i,'O')},420)}}
 function bestMove(){let best=-Infinity,choice=-1;for(let i=0;i<9;i++){if(board[i])continue;board[i]='O';const score=minimax(board,false);board[i]='';if(score>best){best=score;choice=i}}return choice}
 function minimax(b,isMax){const combo=result(b);if(combo)return b[combo[0]]==='O'?10:-10;if(!b.includes(''))return 0;if(isMax){let best=-Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';best=Math.max(best,minimax(b,false));b[i]=''}return best}else{let best=Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='X';best=Math.min(best,minimax(b,true));b[i]=''}return best}}
 function restart(){clearTimeout(timer);board.fill('');turn='X';active=true;thinking=false;setStatus('Your turn · Place an X','Ready to play');render()}
 document.querySelector('#restart').addEventListener('click',restart);document.querySelector('#newGame').addEventListener('click',()=>{scores={x:0,o:0,d:0};restart()});render();
})();
</script>
</body>
</html>
