<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="description" content="XOX — a polished Tic Tac Toe game against Rocky, an intelligent robot.">
<meta name="color-scheme" content="dark">
<title>XOX — Tic Tac Toe vs Rocky</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#11151c;--panel2:#171c25;--cell:#151b24;--line:#293241;--text:#f7f9fc;--muted:#98a1b2;--accent:#69a7ff;--accent2:#8bc0ff;--x:#ff6d82;--o:#6eafff;--win:#63e6a8;--gold:#f4c568}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100svh;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 50% -12%,#263752 0%,#121925 42%,var(--bg) 75%);color:var(--text);display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow-x:hidden}button{font:inherit;color:inherit}.app{width:min(100%,820px);background:#0e1219f5;border:1px solid #ffffff16;border-radius:32px;padding:clamp(18px,4vw,34px);box-shadow:0 30px 90px #0009,inset 0 1px #ffffff08;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}header{text-align:center;margin-bottom:26px}.brand{display:inline-flex;align-items:center;gap:10px;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #69a7ff99}h1{font-size:clamp(2.3rem,8vw,4rem);letter-spacing:-.065em;line-height:.95;margin:11px 0 9px}h1 span{color:var(--accent2)}.subtitle{color:var(--muted);margin:0}.arena{display:grid;grid-template-columns:190px minmax(0,1fr);gap:30px;align-items:start}.robot{text-align:center;padding-top:28px}.robot-face{width:132px;aspect-ratio:1;margin:0 auto 14px;border-radius:36%;display:grid;place-items:center;background:linear-gradient(145deg,#202a39,#10151d);border:1px solid #ffffff14;box-shadow:inset 0 1px #ffffff12,0 18px 40px #0008;font-size:4rem;transition:transform .22s,box-shadow .22s}.robot.thinking .robot-face{animation:robotPulse .7s ease-in-out infinite alternate}.robot-name{font-weight:800}.robot-status{display:inline-flex;margin-top:8px;padding:7px 12px;border-radius:999px;background:#69a7ff12;border:1px solid #69a7ff3d;color:#add0ff;font-size:.76rem}.game{min-width:0;display:flex;flex-direction:column;align-items:center}.status{width:100%;min-height:48px;display:grid;place-items:center;text-align:center;padding:10px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:750;margin-bottom:14px}.board{width:min(100%,430px);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:9px;background:#090c11;border:1px solid #ffffff10;border-radius:24px;box-shadow:inset 0 0 34px #0009}.cell{appearance:none;aspect-ratio:1;border:1px solid #ffffff0d;border-radius:17px;background:linear-gradient(145deg,#1a202a,#11161e);font-size:clamp(2.8rem,12vw,4.7rem);font-weight:850;cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}.cell:hover:not(:disabled),.cell:focus-visible:not(:disabled){transform:translateY(-2px);background:#202936;border-color:#ffffff2b;outline:none;box-shadow:0 8px 22px #0005}.cell:active:not(:disabled){transform:scale(.96)}.cell:disabled{cursor:default}.cell.x{color:var(--x);text-shadow:0 0 26px #ff6d8248}.cell.o{color:var(--o);text-shadow:0 0 26px #6eafff48}.cell.win{color:var(--win)!important;border-color:#63e6a899;background:#63e6a816;box-shadow:0 0 26px #63e6a820;animation:win .7s ease-in-out infinite alternate}.scores{width:min(100%,430px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.score{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center}.score small{color:var(--muted);font-size:.7rem}.score strong{display:block;font-size:1.4rem;margin-top:2px}.score.x strong{color:var(--x)}.score.o strong{color:var(--o)}.score.draw strong{color:var(--gold)}.controls{display:flex;gap:9px;width:min(100%,430px);margin-top:14px}.controls button{flex:1;border:1px solid var(--line);background:#191f29;border-radius:15px;padding:12px 14px;font-weight:800;cursor:pointer;transition:transform .15s,background .15s}.controls .primary{background:#edf4ff;color:#0a1019;border-color:transparent}.controls button:hover,.controls button:focus-visible{transform:translateY(-1px);outline:none}.controls button:active{transform:scale(.98)}.hint{width:min(100%,430px);text-align:center;color:#737d8d;font-size:.72rem;margin-top:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes win{to{transform:scale(1.035)}}@keyframes robotPulse{to{transform:translateY(-3px) scale(1.025);box-shadow:inset 0 1px #ffffff12,0 20px 45px #0009,0 0 28px #69a7ff22}}@media(max-width:650px){body{place-items:start;padding:10px}.app{margin-top:8px;border-radius:26px}.arena{grid-template-columns:1fr;gap:14px}.robot{padding-top:0}.robot-face{width:76px;border-radius:25%;font-size:2.35rem;margin-bottom:7px}.robot-name{font-size:.88rem}.robot-status{margin-top:5px;padding:6px 10px}.status{margin-bottom:10px}.board{gap:7px;padding:7px;border-radius:20px}.cell{border-radius:14px}.controls button{padding:11px 10px}}@media(max-width:360px){.app{padding:15px}.scores{gap:5px}.score{padding:8px 5px}.controls{gap:6px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand"><span class="brand-dot" aria-hidden="true"></span> XOX Arena</div>
<h1><span>X</span>OX</h1>
<p class="subtitle">Tic Tac Toe · You vs Rocky</p>
</header>
<section class="arena" aria-label="XOX game">
<aside class="robot" id="robot" aria-label="Rocky robot opponent">
<div class="robot-face" aria-hidden="true">🤖</div>
<div class="robot-name">Rocky</div>
<div class="robot-status" id="robotStatus">Ready to play</div>
</aside>
<div class="game">
<div class="status" id="status" aria-live="polite" aria-atomic="true">Your turn · Place an X</div>
<div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div>
<div class="scores" aria-label="Scoreboard">
<div class="score x"><small>You</small><strong id="playerScore">0</strong></div>
<div class="score draw"><small>Draws</small><strong id="drawScore">0</strong></div>
<div class="score o"><small>Rocky</small><strong id="robotScore">0</strong></div>
</div>
<div class="controls">
<button class="primary" id="restart" type="button">Restart round</button>
<button id="newGame" type="button">Reset score</button>
</div>
<p class="hint">You are X · Rocky is O · Tap any empty square to play</p>
</div>
</section>
</main>
<script>
(()=>{
'use strict';
const boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),robotStatus=document.querySelector('#robotStatus'),robotEl=document.querySelector('#robot'),playerScore=document.querySelector('#playerScore'),robotScore=document.querySelector('#robotScore'),drawScore=document.querySelector('#drawScore');
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board=Array(9).fill(''),turn='X',active=true,thinking=false,timer=null,round=0,winning=[];
let scores=loadScores();
const cells=[];
for(let i=0;i<9;i++){
 const cell=document.createElement('button');
 cell.className='cell';cell.type='button';cell.dataset.index=i;cell.setAttribute('role','gridcell');
 cell.addEventListener('click',()=>playerMove(i));
 cell.addEventListener('keydown',e=>{
   if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();cells[(i+(e.key==='ArrowRight'?1:3))%9].focus()}
   if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();cells[(i-(e.key==='ArrowLeft'?1:3)+9)%9].focus()}
 });
 boardEl.appendChild(cell);cells.push(cell);
}
function loadScores(){try{const s=JSON.parse(localStorage.getItem('xox-score-v2'));return s&&Number.isFinite(s.x)&&Number.isFinite(s.o)&&Number.isFinite(s.d)?s:{x:0,o:0,d:0}}catch{return{x:0,o:0,d:0}}}
function saveScores(){try{localStorage.setItem('xox-score-v2',JSON.stringify(scores))}catch{}}
function setStatus(text,robot){statusEl.textContent=text;robotStatus.textContent=robot}
function result(b){for(const combo of wins){const[a,c,d]=combo;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return combo}return null}
function render(){
 cells.forEach((cell,i)=>{
   const value=board[i];cell.textContent=value;cell.className='cell'+(value?' '+value.toLowerCase():'')+(winning.includes(i)?' win':'');
   cell.disabled=Boolean(value)||!active||thinking;
   cell.setAttribute('aria-label',`Cell ${i+1}: ${value||'empty'}`);
   cell.setAttribute('aria-selected',winning.includes(i)?'true':'false');
 });
 playerScore.textContent=scores.x;robotScore.textContent=scores.o;drawScore.textContent=scores.d;
 robotEl.classList.toggle('thinking',thinking);
}
function finish(combo){
 active=false;thinking=false;clearTimeout(timer);timer=null;winning=combo||[];
 if(combo){
   const winner=board[combo[0]];
   if(winner==='X'){scores.x++;setStatus('You win!','Rocky has been defeated this round')}
   else{scores.o++;setStatus('Rocky wins!','Rocky takes the round')}
 }else{scores.d++;setStatus('Draw game','Perfectly matched')}
 saveScores();render();
}
function move(index,player){
 if(index<0||index>8||board[index]||!active)return false;
 board[index]=player;
 const combo=result(board);
 if(combo){finish(combo);return true}
 if(!board.includes('')){finish(null);return true}
 turn=player==='X'?'O':'X';render();
 if(turn==='O')setStatus('Rocky is thinking…','Calculating the best move');
 return true;
}
function playerMove(index){
 if(!active||thinking||turn!=='X'||board[index])return;
 if(!move(index,'X')||!active)return;
 thinking=true;const currentRound=round;render();
 timer=setTimeout(()=>{
   timer=null;
   if(!active||currentRound!==round)return;
   thinking=false;move(bestMove(),'O');
 },360);
}
function bestMove(){
 let best=-Infinity,choice=-1;
 const preferred=[4,0,2,6,8,1,3,5,7];
 for(const i of preferred){if(board[i])continue;board[i]='O';const score=minimax(board,false,0);board[i]='';if(score>best){best=score;choice=i}}
 return choice;
}
function minimax(b,maximizing,depth){
 const combo=result(b);
 if(combo)return b[combo[0]]==='O'?100-depth:depth-100;
 if(!b.includes(''))return 0;
 if(maximizing){let best=-Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';best=Math.max(best,minimax(b,false,depth+1));b[i]=''}return best}
 let best=Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]='X';best=Math.min(best,minimax(b,true,depth+1));b[i]=''}return best;
}
function restart(){clearTimeout(timer);timer=null;round++;board=Array(9).fill('');turn='X';active=true;thinking=false;winning=[];setStatus('Your turn · Place an X','Ready to play');render();requestAnimationFrame(()=>cells[4].focus())}
function newGame(){scores={x:0,o:0,d:0};saveScores();restart()}
document.querySelector('#restart').addEventListener('click',restart);document.querySelector('#newGame').addEventListener('click',newGame);
render();
})();
</script>
</body>
</html>
